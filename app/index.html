<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA 6 Trophy Guide - Vice City</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vice City Trophy Guide</h1>
        <div id="progress-container">
            <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
            <div id="progress-text">0 / 55 Trophies</div>
        </div>
    </header>
    <main>
        <div class="controls">
            <input type="text" id="search" placeholder="Search trophies...">
            <div class="filters">
                <button class="filter-btn active" data-tier="all">All</button>
                <button class="filter-btn" data-tier="platinum">Platinum</button>
                <button class="filter-btn" data-tier="gold">Gold</button>
                <button class="filter-btn" data-tier="silver">Silver</button>
                <button class="filter-btn" data-tier="bronze">Bronze</button>
            </div>
        </div>
        <div id="trophies-container"></div>
    </main>
    <script src="app.js"></script>
</body>
</html>
